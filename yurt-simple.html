<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Yurt Configurator - Simple Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
        }

        #panel {
            width: 350px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            overflow-y: auto;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .control {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-size: 13px;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
        }

        .value {
            color: #667eea;
            font-weight: bold;
            float: right;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container">
            <canvas id="canvas"></canvas>

            <div id="loading">
                <div class="spinner"></div>
                <div>Loading 3D Scene...</div>
            </div>

            <div id="info" style="display: none;">
                <strong>🏕️ Yurt Configurator</strong>
                <p style="font-size: 12px; margin-top: 8px;">
                    Use mouse to rotate, scroll to zoom
                </p>
            </div>
        </div>

        <div id="panel">
            <h1>Yurt Configurator</h1>

            <div class="control">
                <label>
                    Diameter
                    <span class="value" id="diameter-val">5.0 m</span>
                </label>
                <input type="range" id="diameter" min="3" max="10" step="0.5" value="5">
            </div>

            <div class="control">
                <label>
                    Wall Height
                    <span class="value" id="wallHeight-val">1.8 m</span>
                </label>
                <input type="range" id="wallHeight" min="1.2" max="2.5" step="0.1" value="1.8">
            </div>

            <div class="control">
                <label>
                    Roof Height
                    <span class="value" id="roofHeight-val">2.5 m</span>
                </label>
                <input type="range" id="roofHeight" min="1.5" max="4" step="0.1" value="2.5">
            </div>

            <div class="control">
                <label>
                    Rafters
                    <span class="value" id="rafters-val">24</span>
                </label>
                <input type="range" id="rafters" min="16" max="48" step="4" value="24">
            </div>

            <div style="background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 20px;">
                <div style="font-weight: bold; margin-bottom: 10px;">Statistics</div>
                <div style="font-size: 13px;">
                    <div>Floor Area: <span id="stat-area">19.6 m²</span></div>
                    <div>Volume: <span id="stat-volume">42.0 m³</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        console.log('Script started');
        console.log('THREE available:', typeof THREE !== 'undefined');

        let scene, camera, renderer, controls, yurtGroup;
        let config = {
            diameter: 5.0,
            wallHeight: 1.8,
            roofHeight: 2.5,
            rafters: 24
        };

        function init() {
            console.log('Initializing...');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            // Camera
            const canvas = document.getElementById('canvas');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
            camera.position.set(8, 6, 8);
            camera.lookAt(0, 2, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;

            // Controls
            controls = new THREE.OrbitControls(camera, canvas);
            controls.enableDamping = true;
            controls.target.set(0, 2, 0);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(5, 10, 7);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Ground
            const groundGeometry = new THREE.CircleGeometry(15, 64);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x7cb342 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Yurt group
            yurtGroup = new THREE.Group();
            scene.add(yurtGroup);

            // Build initial yurt
            buildYurt();

            // Setup controls
            setupControls();

            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('info').style.display = 'block';
            }, 500);

            // Start animation
            animate();

            console.log('Initialization complete');
        }

        function buildYurt() {
            console.log('Building yurt...');

            // Clear existing
            yurtGroup.clear();

            const radius = config.diameter / 2;

            // Platform
            const platformGeometry = new THREE.CylinderGeometry(radius, radius, 0.1, 32);
            const platformMaterial = new THREE.MeshStandardMaterial({ color: 0xa0826d });
            const platform = new THREE.Mesh(platformGeometry, platformMaterial);
            platform.position.y = 0.05;
            platform.castShadow = true;
            yurtGroup.add(platform);

            // Wall canvas
            const wallGeometry = new THREE.CylinderGeometry(radius, radius, config.wallHeight, 64, 1, true);
            const canvasMaterial = new THREE.MeshStandardMaterial({
                color: 0xf5f5dc,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.95
            });
            const wall = new THREE.Mesh(wallGeometry, canvasMaterial);
            wall.position.y = config.wallHeight / 2;
            yurtGroup.add(wall);

            // Roof
            const roofHeight = config.roofHeight - config.wallHeight;
            const roofGeometry = new THREE.ConeGeometry(radius, roofHeight, 64, 1, true);
            const roof = new THREE.Mesh(roofGeometry, canvasMaterial);
            roof.position.y = config.wallHeight + roofHeight / 2;
            yurtGroup.add(roof);

            // Rafters
            const woodMaterial = new THREE.MeshStandardMaterial({ color: 0xdeb887 });
            const tonoRadius = 0.4;

            for (let i = 0; i < config.rafters; i++) {
                const angle = (i / config.rafters) * Math.PI * 2;
                const wallX = Math.cos(angle) * radius;
                const wallZ = Math.sin(angle) * radius;
                const tonoX = Math.cos(angle) * tonoRadius;
                const tonoZ = Math.sin(angle) * tonoRadius;

                const start = new THREE.Vector3(wallX, config.wallHeight, wallZ);
                const end = new THREE.Vector3(tonoX, config.roofHeight, tonoZ);
                const direction = new THREE.Vector3().subVectors(end, start);
                const length = direction.length();

                const rafterGeometry = new THREE.CylinderGeometry(0.02, 0.02, length, 8);
                const rafter = new THREE.Mesh(rafterGeometry, woodMaterial);
                rafter.position.copy(start).add(direction.multiplyScalar(0.5));
                rafter.quaternion.setFromUnitVectors(
                    new THREE.Vector3(0, 1, 0),
                    direction.normalize()
                );
                rafter.castShadow = true;
                yurtGroup.add(rafter);
            }

            // Roof ring
            const ringGeometry = new THREE.TorusGeometry(tonoRadius, 0.04, 12, 32);
            const ring = new THREE.Mesh(ringGeometry, woodMaterial);
            ring.position.y = config.roofHeight;
            ring.rotation.x = Math.PI / 2;
            ring.castShadow = true;
            yurtGroup.add(ring);

            // Door
            const doorGeometry = new THREE.BoxGeometry(0.9, config.wallHeight * 0.8, 0.05);
            const doorMaterial = new THREE.MeshStandardMaterial({ color: 0x654321 });
            const door = new THREE.Mesh(doorGeometry, doorMaterial);
            door.position.set(0, config.wallHeight * 0.4, radius);
            door.castShadow = true;
            yurtGroup.add(door);

            updateStats();
        }

        function updateStats() {
            const radius = config.diameter / 2;
            const area = Math.PI * radius * radius;
            const wallVolume = area * config.wallHeight;
            const roofVolume = (1/3) * area * (config.roofHeight - config.wallHeight);
            const volume = wallVolume + roofVolume;

            document.getElementById('stat-area').textContent = area.toFixed(1) + ' m²';
            document.getElementById('stat-volume').textContent = volume.toFixed(1) + ' m³';
        }

        function setupControls() {
            const controls = ['diameter', 'wallHeight', 'roofHeight', 'rafters'];

            controls.forEach(id => {
                const input = document.getElementById(id);
                const display = document.getElementById(id + '-val');

                input.addEventListener('input', () => {
                    let value = parseFloat(input.value);
                    if (id === 'rafters') {
                        value = parseInt(input.value);
                        display.textContent = value;
                    } else {
                        display.textContent = value.toFixed(1) + ' m';
                    }
                    config[id] = value;
                    buildYurt();
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const canvas = document.getElementById('canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }

        window.addEventListener('resize', onWindowResize);

        // Initialize when loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
